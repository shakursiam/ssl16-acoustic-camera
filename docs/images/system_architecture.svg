<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 484" width="760" height="484" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" role="img" aria-label="SSL-16 architecture: 16 mics reach the ESP32-S3 on one TDM line; core 0 captures, core 1 locates">
<title>SSL-16 system architecture</title>
<rect x="0" y="0" width="760" height="484" fill="#ffffff"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8c959f"/></marker></defs>
<text x="24" y="28" fill="#1f2328" font-size="15" font-weight="600">16 mics reach the ESP32-S3 on one TDM line; core 0 captures, core 1 locates</text>
<g fill="none" stroke="#8c959f" stroke-width="1.25"><path d="M154 170L190 108" marker-end="url(#a)"/><path d="M154 200L190 180" marker-end="url(#a)"/><path d="M154 232L190 252" marker-end="url(#a)"/><path d="M154 262L190 324" marker-end="url(#a)"/><path d="M260 136V152" marker-end="url(#a)"/><path d="M260 208V224" marker-end="url(#a)"/><path d="M260 280V296" marker-end="url(#a)"/><path d="M330 324H356V160H396" marker-end="url(#a)"/><path d="M540 220V268" marker-end="url(#a)"/><path d="M450 268V220" marker-end="url(#a)"/><path d="M596 128H636" marker-end="url(#a)"/><path d="M596 200H636" marker-end="url(#a)"/><path d="M596 212H616V272H636" marker-end="url(#a)"/></g>
<rect x="24" y="150" width="130" height="132" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/>
<text x="36" y="174" fill="#1f2328" font-weight="600">16 MEMS mics</text>
<text x="36" y="196" fill="#57606a" font-size="11.5">IM73A135, analog</text>
<text x="36" y="212" fill="#57606a" font-size="11.5">sunflower spiral</text>
<text x="36" y="228" fill="#57606a" font-size="11.5">157 mm circle</text>
<text x="36" y="244" fill="#57606a" font-size="11.5">4 mics per ADC</text>
<text x="36" y="260" fill="#57606a" font-size="11.5">MICBIAS 2.75 V</text>
<rect x="190" y="80" width="140" height="56" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/>
<text x="202" y="102" fill="#1f2328" font-weight="600">U4 (controller)</text>
<text x="202" y="120" fill="#57606a" font-size="11.5">MK5, 8, 13, 16</text>
<rect x="190" y="152" width="140" height="56" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/>
<text x="202" y="174" fill="#1f2328" font-weight="600">U3</text>
<text x="202" y="192" fill="#57606a" font-size="11.5">MK3, 6, 11, 14</text>
<rect x="190" y="224" width="140" height="56" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/>
<text x="202" y="246" fill="#1f2328" font-weight="600">U2</text>
<text x="202" y="264" fill="#57606a" font-size="11.5">MK1, 4, 9, 12</text>
<rect x="190" y="296" width="140" height="56" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/>
<text x="202" y="318" fill="#1f2328" font-weight="600">U1</text>
<text x="202" y="336" fill="#57606a" font-size="11.5">MK2, 7, 10, 15</text>
<text x="190" y="70" fill="#57606a" font-size="11.5">4 ADCs, daisy chain</text>
<rect x="190" y="376" width="140" height="72" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/>
<text x="202" y="400" fill="#1f2328" font-weight="600">Clocks</text>
<text x="202" y="416" fill="#57606a" font-size="11.5">XO 24.576 MHz → U4</text>
<text x="202" y="432" fill="#57606a" font-size="11.5">LMK1C1104 → BCLK</text>
<rect x="380" y="64" width="232" height="392" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/>
<text x="396" y="86" fill="#1f2328" font-weight="600">ESP32-S3 (2 cores, 240 MHz)</text>
<text x="396" y="420" fill="#57606a" font-size="11.5">Estimated load: core 0 ≈ 15%,</text>
<text x="396" y="436" fill="#57606a" font-size="11.5">core 1 ≈ 17–28% (tones)</text>
<rect x="396" y="100" width="200" height="120" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/>
<text x="408" y="124" fill="#1f2328" font-weight="600">Core 0 · capture</text>
<text x="408" y="140" fill="#1f2328" font-size="11.5">I2S DMA, 16 ch at 48 kHz</text>
<text x="408" y="156" fill="#1f2328" font-size="11.5">de-interleave</text>
<text x="408" y="172" fill="#1f2328" font-size="11.5">FIR, decimate to 12 kHz</text>
<text x="408" y="188" fill="#1f2328" font-size="11.5">ring buffer (PSRAM)</text>
<text x="408" y="204" fill="#1f2328" font-size="11.5">USB / SD output</text>
<text x="548" y="248" fill="#57606a" font-size="11.5">audio</text>
<text x="442" y="248" fill="#57606a" font-size="11.5" text-anchor="end">results</text>
<rect x="396" y="268" width="200" height="104" rx="8" fill="#0969da" fill-opacity="0.12" stroke="#0969da" stroke-width="2"/>
<text x="408" y="292" fill="#1f2328" font-weight="600">Core 1 · beamformer</text>
<text x="408" y="308" fill="#1f2328" font-size="11.5">16 FFTs + PHAT</text>
<text x="408" y="324" fill="#1f2328" font-size="11.5">GCC on 120 mic pairs</text>
<text x="408" y="340" fill="#1f2328" font-size="11.5">grid search + refine</text>
<text x="408" y="356" fill="#1f2328" font-size="11.5">az, el, SNR at 11.7 Hz</text>
<rect x="636" y="100" width="100" height="56" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/>
<text x="648" y="122" fill="#1f2328" font-weight="600">PC GUI</text>
<text x="648" y="140" fill="#57606a" font-size="11.5">USB, 12 kHz</text>
<rect x="636" y="172" width="100" height="56" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25"/>
<text x="648" y="194" fill="#1f2328" font-weight="600">microSD</text>
<text x="648" y="212" fill="#57606a" font-size="11.5">raw 48 kHz</text>
<rect x="636" y="244" width="100" height="56" rx="8" fill="none" stroke="#8c959f" stroke-width="1.25" stroke-dasharray="5 4"/>
<text x="648" y="266" fill="#1f2328" font-weight="600">Wi-Fi / serial</text>
<text x="648" y="284" fill="#57606a" font-size="11.5">results only</text>
<text x="636" y="320" fill="#57606a" font-size="11.5">dashed = optional</text>
</svg>